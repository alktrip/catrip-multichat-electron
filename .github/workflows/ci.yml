name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Comprobar formato
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests unitarios (enlaces WhatsApp)
        run: npm run test:unit

      - name: Instalar Playwright (Chromium)
        run: npx playwright install chromium --with-deps

      - name: Tests E2E
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x960x24' npm run test:e2e
        env:
          CI: "1"

  package-appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar dependencias de empaquetado (deb/AppImage)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg fakeroot python3-pil

      - name: Build AppImage
        run: npm run dist:appimage

      - name: Verificar artefactos de actualización
        run: |
          test -f release/catrip-connect_*_x86_64.AppImage
          test -f release/latest-linux.yml
          ls -lh release/

      - name: Subir AppImage (artefacto CI)
        uses: actions/upload-artifact@v4
        with:
          name: catrip-connect-appimage-linux-x64
          path: |
            release/catrip-connect_*_x86_64.AppImage
            release/latest-linux.yml
          retention-days: 14
