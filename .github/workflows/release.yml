name: Release Linux

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar dependencias de empaquetado
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg fakeroot

      - name: Build paquetes Linux (.deb + AppImage)
        run: npm run dist:linux

      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/catrip-connect_*_amd64.deb
            release/catrip-connect_*_x86_64.AppImage
            release/latest-linux.yml
          generate_release_notes: true
